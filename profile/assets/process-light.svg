<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="230" viewBox="0 0 1280 230" font-family="'Inter Tight', Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">How we work: consultation, quote, delivery, support</title>

  <style>
    .scan { animation: scan 6s cubic-bezier(.16,1,.3,1) infinite; }
    @keyframes scan { 0% { transform: translateX(-420px); } 45%, 100% { transform: translateX(1700px); } }
    .ping { animation: ping 6s ease infinite; }
    .ping-late { animation-delay: 1.6s; }
    @keyframes ping { 0%, 40%, 100% { stroke: #d4d4d8; } 12% { stroke: #f9a427; } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .55; } 70%, 100% { transform: scale(2.6); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .scan, .ping, .pulse { animation: none; } .scan { display: none; } }
  </style>

  <defs>
    <pattern id="p-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.1" fill="rgba(24,24,27,0.22)"/>
    </pattern>
    <radialGradient id="p-fade" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0.1" stop-color="#fff"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="p-mask"><rect width="100%" height="100%" fill="url(#p-fade)"/></mask>
    <radialGradient id="p-glow">
      <stop offset="0" stop-color="#f9a427"/>
      <stop offset="1" stop-color="#f9a427" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p-scan" x1="0" x2="1">
      <stop offset="0" stop-color="#f9a427" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#f9a427"/>
      <stop offset="1" stop-color="#f9a427" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <defs>
    <linearGradient id="p-fill" gradientUnits="userSpaceOnUse" x1="52" y1="0" x2="232" y2="0">
      <stop offset="0" stop-color="#f9a427"/>
      <stop offset="1" stop-color="#f9a427" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="230" rx="14" fill="#ffffff"/>
  <g stroke="#d4d4d8" stroke-dasharray="5 4">
    <line x1="64" y1="0" x2="64" y2="230"/>
    <line x1="1216" y1="0" x2="1216" y2="230"/>
  </g>
  <rect x="64" y="30" width="1152" height="170" fill="#ffffff" stroke="#e4e4e7"/>
    <g transform="translate(92 70)">
      <circle class="pulse" cx="6" cy="0" r="6" fill="#f9a427" opacity=".3" style="animation-delay:0s"/>
      <circle cx="6" cy="0" r="3" fill="#f9a427"/>
      <text x="22" y="5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#a86400">01</text>
      <line x1="52" y1="0" x2="232" y2="0" stroke="#d4d4d8" stroke-dasharray="5 4"/>
      <line x1="52" y1="0" x2="232" y2="0" stroke="url(#p-fill)"/>
      <text y="48" font-size="19" font-weight="600" fill="#111827">Consultation</text>
      <text y="76" font-size="15" fill="#4b5563">We talk through what you need,</text>
      <text y="98" font-size="15" fill="#4b5563">free and with no commitment.</text>
    </g>
    <g transform="translate(380 70)">
      <circle class="pulse" cx="6" cy="0" r="6" fill="#f9a427" opacity=".3" style="animation-delay:0.4s"/>
      <circle cx="6" cy="0" r="3" fill="#f9a427"/>
      <text x="22" y="5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#a86400">02</text>
      <line x1="52" y1="0" x2="232" y2="0" stroke="#d4d4d8" stroke-dasharray="5 4"/>
      <line x1="52" y1="0" x2="232" y2="0" stroke="url(#p-fill)"/>
      <text y="48" font-size="19" font-weight="600" fill="#111827">Quote</text>
      <text y="76" font-size="15" fill="#4b5563">A written quote with a clear</text>
      <text y="98" font-size="15" fill="#4b5563">scope and price.</text>
    </g>
    <line x1="352" y1="30" x2="352" y2="200" stroke="#e4e4e7"/>
    <g transform="translate(668 70)">
      <circle class="pulse" cx="6" cy="0" r="6" fill="#f9a427" opacity=".3" style="animation-delay:0.8s"/>
      <circle cx="6" cy="0" r="3" fill="#f9a427"/>
      <text x="22" y="5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#a86400">03</text>
      <line x1="52" y1="0" x2="232" y2="0" stroke="#d4d4d8" stroke-dasharray="5 4"/>
      <line x1="52" y1="0" x2="232" y2="0" stroke="url(#p-fill)"/>
      <text y="48" font-size="19" font-weight="600" fill="#111827">Delivery</text>
      <text y="76" font-size="15" fill="#4b5563">We build or install, and keep</text>
      <text y="98" font-size="15" fill="#4b5563">you informed throughout.</text>
    </g>
    <line x1="640" y1="30" x2="640" y2="200" stroke="#e4e4e7"/>
    <g transform="translate(956 70)">
      <circle class="pulse" cx="6" cy="0" r="6" fill="#f9a427" opacity=".3" style="animation-delay:1.2000000000000002s"/>
      <circle cx="6" cy="0" r="3" fill="#f9a427"/>
      <text x="22" y="5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#a86400">04</text>
      <line x1="52" y1="0" x2="232" y2="0" stroke="#d4d4d8" stroke-dasharray="5 4"/>
      <line x1="52" y1="0" x2="232" y2="0" stroke="url(#p-fill)"/>
      <text y="48" font-size="19" font-weight="600" fill="#111827">Support</text>
      <text y="76" font-size="15" fill="#4b5563">We stay on call after the</text>
      <text y="98" font-size="15" fill="#4b5563">project is handed over.</text>
    </g>
    <line x1="928" y1="30" x2="928" y2="200" stroke="#e4e4e7"/>
  <rect class="" x="59.5" y="25.5" width="9" height="9" rx="1.5" fill="#ffffff" stroke="#d4d4d8"/>
  <rect class="" x="1211.5" y="25.5" width="9" height="9" rx="1.5" fill="#ffffff" stroke="#d4d4d8"/>
  <rect class="" x="59.5" y="195.5" width="9" height="9" rx="1.5" fill="#ffffff" stroke="#d4d4d8"/>
  <rect class="" x="1211.5" y="195.5" width="9" height="9" rx="1.5" fill="#ffffff" stroke="#d4d4d8"/>
  <rect x="0.5" y="0.5" width="1279" height="229" rx="14" fill="none" stroke="#e4e4e7"/>
</svg>
