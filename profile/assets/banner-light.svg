<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" font-family="'Inter Tight', Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">OMNI Tech Solutions</title>
  <desc id="d">Software solutions and IT infrastructure for business. We build software for clients in Bulgaria and abroad, and the IT infrastructure that runs it.</desc>

  <style>
    .scan { animation: scan 6s cubic-bezier(.16,1,.3,1) infinite; }
    @keyframes scan { 0% { transform: translateX(-420px); } 45%, 100% { transform: translateX(1700px); } }
    .ping { animation: ping 6s ease infinite; }
    .ping-late { animation-delay: 1.6s; }
    @keyframes ping { 0%, 40%, 100% { stroke: #d4d4d8; } 12% { stroke: #f9a427; } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .55; } 70%, 100% { transform: scale(2.6); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .scan, .ping, .pulse { animation: none; } .scan { display: none; } }
  </style>

  <defs>
    <pattern id="b-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.1" fill="rgba(24,24,27,0.22)"/>
    </pattern>
    <radialGradient id="b-fade" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0.1" stop-color="#fff"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="b-mask"><rect width="100%" height="100%" fill="url(#b-fade)"/></mask>
    <radialGradient id="b-glow">
      <stop offset="0" stop-color="#f9a427"/>
      <stop offset="1" stop-color="#f9a427" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="b-scan" x1="0" x2="1">
      <stop offset="0" stop-color="#f9a427" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#f9a427"/>
      <stop offset="1" stop-color="#f9a427" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="560" rx="14" fill="#ffffff"/>

  <!-- Dot grid fading out from behind the headline, and a faint warm glow -->
  <rect x="64" y="96" width="1152" height="324" fill="url(#b-dots)" mask="url(#b-mask)"/>
  <ellipse cx="640" cy="240" rx="360" ry="130" fill="url(#b-glow)" opacity="0.16"/>

  <!-- Frame: dashed rails and the rule under the top bar -->
  <g stroke="#d4d4d8" stroke-dasharray="5 4">
    <line x1="64" y1="0" x2="64" y2="560"/>
    <line x1="1216" y1="0" x2="1216" y2="560"/>
    <line x1="0" y1="96" x2="1280" y2="96"/>
  </g>
  <rect class="scan" x="0" y="95.25" width="420" height="1.5" fill="url(#b-scan)"/>
  <rect class="ping" x="59.5" y="91.5" width="9" height="9" rx="1.5" fill="#ffffff" stroke="#d4d4d8"/>
  <rect class="ping ping-late" x="1211.5" y="91.5" width="9" height="9" rx="1.5" fill="#ffffff" stroke="#d4d4d8"/>

  <!-- Top bar: logo, name, site -->
  <image href="data:image/png;base64," x="96" y="28" width="40" height="40"/>
  <text x="150" y="55" font-size="20" font-weight="700" letter-spacing="0.6" fill="#111827">OMNI Tech Solutions</text>
  <text x="1184" y="55" font-size="16" font-weight="500" text-anchor="end" fill="#4b5563">tech.omni-solutions.co</text>

  <!-- Tag, headline, one line under it -->
  <rect x="508" y="140" width="264" height="34" rx="7" fill="none" stroke="#f9a427" stroke-dasharray="4 3"/>
  <text x="640" y="163" font-size="15" font-weight="500" text-anchor="middle" fill="#a86400">Software &amp; IT infrastructure</text>
  <text x="640" y="246" font-size="58" font-weight="500" letter-spacing="-1.4" text-anchor="middle" fill="#111827">Software solutions and</text>
  <text x="640" y="310" font-size="58" font-weight="500" letter-spacing="-1.4" text-anchor="middle" fill="#111827">IT infrastructure for business</text>
  <text x="640" y="362" font-size="19" text-anchor="middle" fill="#374151">We build software for clients in Bulgaria and abroad, and the IT infrastructure that runs it.</text>

  <!-- The three pillars as a strip of hairline cells on the rails -->
  <line x1="64" y1="420" x2="1216" y2="420" stroke="#e4e4e7"/>
    <g transform="translate(96 450)">
      <g fill="none" stroke="#a86400" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></g>
      <text y="60" font-size="19" font-weight="600" fill="#111827">Software solutions</text>
      <text y="86" font-size="15" fill="#4b5563">Web, desktop &amp; mobile apps, websites</text>
    </g>
    <g transform="translate(480 450)">
      <g fill="none" stroke="#a86400" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3M12 12V8"/></g>
      <text y="60" font-size="19" font-weight="600" fill="#111827">IT infrastructure</text>
      <text y="86" font-size="15" fill="#4b5563">Networks, PCs &amp; video surveillance</text>
    </g>
    <line x1="448" y1="420" x2="448" y2="560" stroke="#e4e4e7"/>
    <g transform="translate(864 450)">
      <g fill="none" stroke="#a86400" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g>
      <text y="60" font-size="19" font-weight="600" fill="#111827">Support and security</text>
      <text y="86" font-size="15" fill="#4b5563">Maintenance plans &amp; security audits</text>
    </g>
    <line x1="832" y1="420" x2="832" y2="560" stroke="#e4e4e7"/>
  <rect class="" x="59.5" y="415.5" width="9" height="9" rx="1.5" fill="#ffffff" stroke="#d4d4d8"/>
  <rect class="" x="1211.5" y="415.5" width="9" height="9" rx="1.5" fill="#ffffff" stroke="#d4d4d8"/>

  <rect x="0.5" y="0.5" width="1279" height="559" rx="14" fill="none" stroke="#e4e4e7"/>
</svg>
