<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" font-family="'Inter Tight', Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">How we work: consultation, quote, delivery, support</title>

  <style>
    .scan { animation: scan 6s cubic-bezier(.16,1,.3,1) infinite; }
    @keyframes scan { 0% { transform: translateX(-420px); } 45%, 100% { transform: translateX(1700px); } }
    .ping { animation: ping 6s ease infinite; }
    .ping-late { animation-delay: 1.6s; }
    @keyframes ping { 0%, 40%, 100% { stroke: #3d3a3a; } 12% { stroke: #f9a427; } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .55; } 70%, 100% { transform: scale(2.6); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .scan, .ping, .pulse { animation: none; } .scan { display: none; } }
  </style>

  <defs>
    <pattern id="p-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.1" fill="rgba(255,255,255,0.16)"/>
    </pattern>
    <radialGradient id="p-fade" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0.1" stop-color="#fff"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="p-mask"><rect width="100%" height="100%" fill="url(#p-fade)"/></mask>
    <radialGradient id="p-glow">
      <stop offset="0" stop-color="#f9a427"/>
      <stop offset="1" stop-color="#f9a427" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p-scan" x1="0" x2="1">
      <stop offset="0" stop-color="#f9a427" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#f9a427"/>
      <stop offset="1" stop-color="#f9a427" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <defs>
    <linearGradient id="p-fill" gradientUnits="userSpaceOnUse" x1="52" y1="0" x2="164" y2="0">
      <stop offset="0" stop-color="#f9a427"/>
      <stop offset="1" stop-color="#f9a427" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="960" height="210" rx="14" fill="#151414"/>
  <g stroke="#3d3a3a" stroke-dasharray="5 4">
    <line x1="40" y1="0" x2="40" y2="210"/>
    <line x1="920" y1="0" x2="920" y2="210"/>
  </g>
  <rect x="40" y="24" width="880" height="162" fill="#151414" stroke="#2e2c2c"/>
    <g transform="translate(64 62)">
      <circle class="pulse" cx="6" cy="0" r="6" fill="#f9a427" opacity=".3" style="animation-delay:0s"/>
      <circle cx="6" cy="0" r="3" fill="#f9a427"/>
      <text x="22" y="5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#f9a427">01</text>
      <line x1="52" y1="0" x2="164" y2="0" stroke="#3d3a3a" stroke-dasharray="5 4"/>
      <line x1="52" y1="0" x2="164" y2="0" stroke="url(#p-fill)"/>
      <text y="48" font-size="19" font-weight="600" fill="#ece3de">Consultation</text>
      <text y="76" font-size="15" fill="#9c938f">A free talk about</text>
      <text y="98" font-size="15" fill="#9c938f">what you need.</text>
    </g>
    <g transform="translate(284 62)">
      <circle class="pulse" cx="6" cy="0" r="6" fill="#f9a427" opacity=".3" style="animation-delay:0.4s"/>
      <circle cx="6" cy="0" r="3" fill="#f9a427"/>
      <text x="22" y="5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#f9a427">02</text>
      <line x1="52" y1="0" x2="164" y2="0" stroke="#3d3a3a" stroke-dasharray="5 4"/>
      <line x1="52" y1="0" x2="164" y2="0" stroke="url(#p-fill)"/>
      <text y="48" font-size="19" font-weight="600" fill="#ece3de">Quote</text>
      <text y="76" font-size="15" fill="#9c938f">Clear scope and price,</text>
      <text y="98" font-size="15" fill="#9c938f">in writing.</text>
    </g>
    <line x1="260" y1="24" x2="260" y2="186" stroke="#2e2c2c"/>
    <g transform="translate(504 62)">
      <circle class="pulse" cx="6" cy="0" r="6" fill="#f9a427" opacity=".3" style="animation-delay:0.8s"/>
      <circle cx="6" cy="0" r="3" fill="#f9a427"/>
      <text x="22" y="5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#f9a427">03</text>
      <line x1="52" y1="0" x2="164" y2="0" stroke="#3d3a3a" stroke-dasharray="5 4"/>
      <line x1="52" y1="0" x2="164" y2="0" stroke="url(#p-fill)"/>
      <text y="48" font-size="19" font-weight="600" fill="#ece3de">Delivery</text>
      <text y="76" font-size="15" fill="#9c938f">We build or install and</text>
      <text y="98" font-size="15" fill="#9c938f">keep you informed.</text>
    </g>
    <line x1="480" y1="24" x2="480" y2="186" stroke="#2e2c2c"/>
    <g transform="translate(724 62)">
      <circle class="pulse" cx="6" cy="0" r="6" fill="#f9a427" opacity=".3" style="animation-delay:1.2000000000000002s"/>
      <circle cx="6" cy="0" r="3" fill="#f9a427"/>
      <text x="22" y="5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#f9a427">04</text>
      <line x1="52" y1="0" x2="164" y2="0" stroke="#3d3a3a" stroke-dasharray="5 4"/>
      <line x1="52" y1="0" x2="164" y2="0" stroke="url(#p-fill)"/>
      <text y="48" font-size="19" font-weight="600" fill="#ece3de">Support</text>
      <text y="76" font-size="15" fill="#9c938f">We stay on call after</text>
      <text y="98" font-size="15" fill="#9c938f">the handover.</text>
    </g>
    <line x1="700" y1="24" x2="700" y2="186" stroke="#2e2c2c"/>
  <rect class="" x="35.5" y="19.5" width="9" height="9" rx="1.5" fill="#151414" stroke="#3d3a3a"/>
  <rect class="" x="915.5" y="19.5" width="9" height="9" rx="1.5" fill="#151414" stroke="#3d3a3a"/>
  <rect class="" x="35.5" y="181.5" width="9" height="9" rx="1.5" fill="#151414" stroke="#3d3a3a"/>
  <rect class="" x="915.5" y="181.5" width="9" height="9" rx="1.5" fill="#151414" stroke="#3d3a3a"/>
  <rect x="0.5" y="0.5" width="959" height="209" rx="14" fill="none" stroke="#2e2c2c"/>
</svg>
